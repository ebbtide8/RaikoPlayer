<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Player PWA - 2.3.0</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1f6aa5">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .player-card {
            background-color: #2d2d2d;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 450px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        /* メタデータ表示エリア */
        .meta-container {
            display: flex;
            flex-direction: column;
            background-color: #202020;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }
        
        .cover-art {
            width: 100%;
            height: 200px;
            background-color: #3a3a3a;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .cover-art:hover { opacity: 0.8; }
        
        .track-info { width: 100%; overflow: hidden; }
        .track-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-album, .track-artist {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* レジューム・時間通知 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 10px;
            height: 22px;
        }
        .resume-status { color: #2ecc71; }
        .time-display { color: #aaa; font-family: monospace; font-size: 16px; }
        
        /* シークバー（通常の1本） */
        .seekbar-container {
            margin-bottom: 20px;
        }
        .seek-bar {
            -webkit-appearance: none;
            width: 100%;
            height: 10px;
            background: #444;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            margin: 0;
        }
        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #1f6aa5;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .seek-bar::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .seek-bar::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #1f6aa5;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        .seek-bar {
            background: linear-gradient(to right, #1f6aa5 0%, #1f6aa5 var(--val, 0%), #444 var(--val, 0%), #444 100%);
        }

        /* 最下部コントロールバー */
        .bottom-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            height: 78px;
            position: relative;
        }
        
        .icon-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:hover { transform: scale(1.1); }
        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }
        input[type="file"] { display: none; }
        
        /* 中央の再生ボタン */
        .play-btn {
            width: 56px;
            height: 56px;
            background-color: #1f6aa5;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .play-btn:hover {
            background-color: #144d77;
            transform: scale(1.05);
        }
        .play-btn svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
            margin-left: 3px;
        }
        .play-btn.playing svg {
            margin-left: 0;
        }

        /* 早送り・巻き戻しボタン（10秒／30秒） */
        .skip-btn {
            flex-direction: column;
            gap: 3px;
        }
        .skip-btn svg {
            width: 32px;
            height: 32px;
        }
        .skip-label {
            font-size: 11px;
            color: #ccc;
            line-height: 1;
            user-select: none;
        }

        /* ファイル読込み・スリープ・HPの行 */
        .utility-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            height: 50px;
            margin-top: 14px;
        }
        .version-tag {
            text-align: center;
            font-size: 10px;
            color: #555;
            margin-top: 4px;
            user-select: none;
        }
        .utility-row .icon-btn svg {
            width: 30px;
            height: 30px;
        }
        .utility-row .hp-btn svg {
            width: 24px;
            height: 24px;
        }
        .sleep-combo {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 13px;
            color: #aaa;
            margin-left: 28px;
        }
        .sleep-combo:hover { transform: scale(1.05); }
        .icon-btn.active svg {
            fill: #2ecc71;
        }
        #sleep-status.active {
            color: #2ecc71;
            font-family: monospace;
        }

        /* トーク強調（OFF/Low/High） */
        #talk-enhance-btn.level-low svg {
            fill: #2ecc71;
        }
        #talk-enhance-status.level-low {
            color: #2ecc71;
        }
        #talk-enhance-btn.level-high svg {
            fill: #ff9800;
        }
        #talk-enhance-status.level-high {
            color: #ff9800;
        }

        /* ブランク（無音）スキップ */
        .blank-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #aaa;
        }
        .blank-row .blank-nav-btn svg {
            width: 30px;
            height: 30px;
        }
        .blank-status-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 170px;
        }
        #blank-status {
            text-align: center;
            pointer-events: none; /* タップ/クリックは重なった透明ボタン側で受け、テキスト選択を防ぐ */
            -webkit-user-select: none;
            user-select: none;
        }
        .blank-status-hit {
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        .blank-nav-btn.disabled {
            opacity: 0.3;
            cursor: default;
        }
        .blank-nav-btn.disabled:hover { transform: scale(1); }
        #blank-status.ready { color: #2ecc71; }

        /* 再生位置の同期ステータス（再生ボタンの下） */
        .position-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            margin-bottom: 4px;
            font-size: 13px;
            color: #aaa;
        }
        .position-status-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 170px;
        }
        #position-status {
            text-align: center;
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .position-status-hit {
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        #position-status.ready { color: #2ecc71; }
        #position-status.error { color: #ff5252; }

        /* HPボタン */
        .hp-btn {
            opacity: 1;
        }
        .hp-btn.disabled {
            opacity: 0.3;
            cursor: default;
        }
        .hp-btn.disabled:hover { transform: scale(1); }

        /* 歌詞オーバーレイ */
        .lyrics-overlay {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 80%;
            background-color: rgba(40, 40, 40, 0.95);
            box-sizing: border-box;
            padding: 25px;
            border-top: 2px solid #1f6aa5;
            transition: bottom 0.3s ease-in-out;
            text-align: left;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .lyrics-overlay.active { bottom: 0; }
        .lyrics-header {
            font-size: 14px;
            font-weight: bold;
            color: #1f6aa5;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }
        .lyrics-content {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #eee;
            padding-right: 5px;
        }
    </style>
</head>
<body>

<div class="player-card">
    
    <div class="meta-container">
        <div class="cover-art" id="cover-art" title="クリックで歌詞を表示">[No Cover]</div>
        <div class="track-info">
            <div class="track-title" id="track-title">-</div>
            <div class="track-album" id="track-album">-</div>
            <div class="track-artist" id="track-artist">-</div>
        </div>
    </div>
    
    <div class="status-bar">
        <div class="resume-status" id="resume-status"></div>
        <div class="time-display" id="time-display">00:00 / 00:00</div>
    </div>
    
    <div class="seekbar-container">
        <input type="range" class="seek-bar" id="seek-bar" min="0" max="100" value="0" step="0.1">
    </div>

    <div class="blank-row">
        <div class="icon-btn blank-nav-btn disabled" id="blank-prev-btn" title="前のブランクへ戻る">
            <svg viewBox="0 0 24 24" style="transform: scaleX(-1);">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
        </div>
        <div class="blank-status-wrap">
            <span id="blank-status">ブランク検出: 確認中…</span>
            <button type="button" class="blank-status-hit" id="blank-status-hit" aria-label="ブランク検出の状態（タップで許可/再検索、長押しでリセット）"></button>
        </div>
        <div class="icon-btn blank-nav-btn disabled" id="blank-next-btn" title="次のブランクへ進む">
            <svg viewBox="0 0 24 24">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
        </div>
    </div>

    <div class="bottom-controls">
        <div class="icon-btn skip-btn" id="rewind30-btn" title="30秒巻き戻し">
            <svg viewBox="0 0 24 24">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
            <span class="skip-label">30</span>
        </div>

        <div class="icon-btn skip-btn" id="rewind-btn" title="10秒巻き戻し">
            <svg viewBox="0 0 24 24">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
            <span class="skip-label">10</span>
        </div>

        <div class="icon-btn play-btn" id="play-btn">
            <svg viewBox="0 0 24 24" id="play-icon">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </div>

        <div class="icon-btn skip-btn" id="forward-btn" title="10秒早送り">
            <svg viewBox="0 0 24 24" style="transform: scaleX(-1);">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
            <span class="skip-label">10</span>
        </div>

        <div class="icon-btn skip-btn" id="forward30-btn" title="30秒早送り">
            <svg viewBox="0 0 24 24" style="transform: scaleX(-1);">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
            <span class="skip-label">30</span>
        </div>
    </div>

    <div class="position-row">
        <div class="position-status-wrap">
            <span id="position-status">再生位置：確認中…</span>
            <button type="button" class="position-status-hit" id="position-status-hit" aria-label="再生位置同期の状態（タップで許可/再試行、長押しでリセット）"></button>
        </div>
    </div>

    <div class="utility-row">
        <label class="icon-btn" title="音声ファイルを選択">
            <svg viewBox="0 0 24 24">
                <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
            </svg>
            <input type="file" id="audio-file" accept="audio/*">
        </label>

        <div class="icon-btn sleep-combo" id="talk-enhance-btn" title="トーク強調（クリックで切替: OFF→Low→High）">
            <svg viewBox="0 0 24 24">
                <path d="M10 20h4V4h-4v16zm-6 0h4v-8H4v8zm12-16v16h4V4h-4z"/>
            </svg>
            <span id="talk-enhance-status">OFF</span>
        </div>

        <div class="icon-btn sleep-combo" id="sleep-btn" title="スリープタイマー（クリックで切替）">
            <svg viewBox="0 0 24 24">
                <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-5.4-5.4c0-1.71.87-3.22 2.2-4.1-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
            <span id="sleep-status">OFF</span>
        </div>

        <div class="icon-btn hp-btn disabled" id="hp-btn" title="ホームページを開く">
            <svg viewBox="0 0 24 24">
                <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
            </svg>
        </div>
    </div>

    <div class="version-tag">v2.3.0</div>

    <audio id="audio-player" style="display: none;"></audio>

    <div class="lyrics-overlay" id="lyrics-overlay">
        <div class="lyrics-header" id="lyrics-close">
            <span>【歌詞表示】</span>
            <span>閉じる ✕</span>
        </div>
        <div class="lyrics-content" id="lyrics-content">歌詞情報がありません。</div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW登録失敗', err));
        });
    }

    const fileInput = document.getElementById('audio-file');
    const audioPlayer = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const hpBtn = document.getElementById('hp-btn');
    const rewindBtn = document.getElementById('rewind-btn');
    const forwardBtn = document.getElementById('forward-btn');
    const talkEnhanceBtn = document.getElementById('talk-enhance-btn');
    const talkEnhanceStatus = document.getElementById('talk-enhance-status');
    const sleepBtn = document.getElementById('sleep-btn');
    const sleepStatus = document.getElementById('sleep-status');
    const blankPrevBtn = document.getElementById('blank-prev-btn');
    const blankNextBtn = document.getElementById('blank-next-btn');
    const blankStatus = document.getElementById('blank-status');
    const blankStatusHit = document.getElementById('blank-status-hit');
    const positionStatus = document.getElementById('position-status');
    const positionStatusHit = document.getElementById('position-status-hit');
    const timeDisplay = document.getElementById('time-display');
    const seekBar = document.getElementById('seek-bar');
    const rewind30Btn = document.getElementById('rewind30-btn');
    const forward30Btn = document.getElementById('forward30-btn');
    
    const trackTitle = document.getElementById('track-title');
    const trackAlbum = document.getElementById('track-album');
    const trackArtist = document.getElementById('track-artist');
    const coverArt = document.getElementById('cover-art');
    const resumeStatus = document.getElementById('resume-status');
    const lyricsOverlay = document.getElementById('lyrics-overlay');
    const lyricsContent = document.getElementById('lyrics-content');
    const lyricsClose = document.getElementById('lyrics-close');

    let currentFileName = "";
    let currentHpUrl = "";
    let isDragging = false;
    let wasPlayingBeforeDrag = false;
    let lastSavedTime = 0;
    let lastDiskSavedTime = 0;
    const RESUME_SAVE_INTERVAL = 2;  // 秒。ローカル(localStorage)保存の間引き間隔
    const DISK_SAVE_INTERVAL = 10;   // 秒。_JSON/*.blanks.json への書き込みの間引き間隔

    let userSeekedSinceLoad = false; // シークバー操作や早送り/巻き戻しなど、ユーザーが自分で位置を変えたか
                                      // （非同期の_JSON読み込みが遅れて自動再生が数秒進んでしまっても、
                                      //   ユーザー自身が操作していなければ他デバイスの位置を適用してよい判断に使う）

    let blankIntervals = [];      // 検出された無音区間 [{start, end}, ...]（秒）。_JSONのblanks.jsonから読み込まれる
    let blankScanToken = 0;       // ファイル切り替え時に古い非同期処理の結果を無視するためのトークン
    let blankLocalDone = false;   // このファイルで_JSONからの読込みが完了したか
    let blanksFileData = null;    // 現在のファイルの.blanks.json全体（app/version/fileName/duration/generatedAt/intervals等）
                                   // position更新時に、既存の内容を保ったまま書き戻すために保持しておく
    let positionUIState = 'idle'; // 再生位置ステータス表示の現在の状態

    const svgPlay = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
    const svgPause = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

    function updateSeekBarVisual(current, duration) {
        if (!duration || isNaN(duration)) return;
        const percent = (current / duration) * 100;
        seekBar.style.setProperty('--val', `${percent}%`);
    }

    seekBar.addEventListener('input', (e) => {
        if (!isDragging) {
            isDragging = true;
            wasPlayingBeforeDrag = !audioPlayer.paused;
        }
        const val = parseFloat(e.target.value);
        updateSeekBarVisual(val, audioPlayer.duration);
        updateTimeDisplay(val, audioPlayer.duration);
    });

    seekBar.addEventListener('change', (e) => {
        const val = parseFloat(e.target.value);
        audioPlayer.currentTime = val;
        isDragging = false;
        userSeekedSinceLoad = true;

        if (wasPlayingBeforeDrag) {
            audioPlayer.play().catch(e => console.log("シーク後の自動再生ブロック", e));
        }
    });

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateTimeDisplay(current, total) {
        timeDisplay.textContent = `${formatTime(current)} / ${formatTime(total)}`;
    }

    function saveResumePosition(position) {
        if (!currentFileName || position <= 0) return;
        const record = { position, updatedAt: Date.now() };
        localStorage.setItem(`resume_${currentFileName}`, JSON.stringify(record));
        lastSavedTime = position;
    }

    // ----------------------------------------------------
    // ブランクスキップ機能：_JSONフォルダの .blanks.json を自動で探して読み込むだけ。
    // アプリ内での無音検出（スキャン）は行わない。
    // ----------------------------------------------------
    let blankUIState = 'idle';

    function updateBlankUI(state) {
        // state: 'idle'（_JSON確認中） | 'done'（見つかった） | 'notfound'（見つからなかった） | 'unsupported'（非対応ブラウザ）
        blankUIState = state;
        blankStatus.classList.remove('ready');

        if (state === 'idle') {
            blankStatus.textContent = 'ブランク検出: 確認中…';
            blankPrevBtn.classList.add('disabled');
            blankNextBtn.classList.add('disabled');
        } else if (state === 'done') {
            blankStatus.classList.add('ready');
            refreshBlankNav();
        } else if (state === 'unsupported') {
            blankStatus.textContent = 'JSON不検出（非対応ブラウザ）';
            blankPrevBtn.classList.add('disabled');
            blankNextBtn.classList.add('disabled');
        } else {
            // 'notfound'
            blankStatus.textContent = 'JSON不検出（タップで許可/再検索）';
            blankPrevBtn.classList.add('disabled');
            blankNextBtn.classList.add('disabled');
        }
    }

    // 検出済み状態のときだけ、現在の再生位置に応じて「I◀ ブランク検出（n/合計） ▶I」の表示を更新する
    function refreshBlankNav() {
        if (blankUIState !== 'done') return;

        const total = blankIntervals.length;
        if (total === 0) {
            blankStatus.textContent = 'JSON不検出';
            blankStatus.classList.remove('ready');
            blankPrevBtn.classList.add('disabled');
            blankNextBtn.classList.add('disabled');
            return;
        }

        const cur = audioPlayer.currentTime || 0;
        const passed = blankIntervals.filter(iv => iv.end <= cur + 0.05).length;
        const displayIndex = Math.min(passed + 1, total);

        blankStatus.textContent = `ブランク検出（${displayIndex}/${total}）`;
        blankPrevBtn.classList.toggle('disabled', passed === 0);
        blankNextBtn.classList.toggle('disabled', passed >= total);
    }

    // 「再生位置：〜」の表示を更新する
    function updatePositionStatus(state) {
        // state: 'checking' | 'loaded' | 'recording' | 'error' | 'nofolder' | 'unsupported'
        positionUIState = state;
        positionStatus.classList.remove('ready', 'error');

        if (state === 'checking') {
            positionStatus.textContent = '再生位置：確認中…';
        } else if (state === 'loaded') {
            positionStatus.textContent = '再生位置：読み込み完了';
            positionStatus.classList.add('ready');
        } else if (state === 'recording') {
            positionStatus.textContent = '再生位置：記録中';
            positionStatus.classList.add('ready');
        } else if (state === 'error') {
            positionStatus.textContent = '再生位置：読み込みエラー（タップで再試行）';
            positionStatus.classList.add('error');
        } else if (state === 'unsupported') {
            positionStatus.textContent = '再生位置：非対応ブラウザ';
        } else {
            // 'nofolder'
            positionStatus.textContent = '再生位置：タップで許可';
        }
    }

    function jumpToNextBlank() {
        if (!blankIntervals.length || !audioPlayer.src) return;
        const cur = audioPlayer.currentTime;
        // 現在位置より後ろにある（まだ通過していない）最初の無音区間の「終わり」へ飛ぶ
        const next = blankIntervals.find(iv => iv.end > cur + 0.5);
        if (next) {
            const dur = isFinite(audioPlayer.duration) ? audioPlayer.duration : next.end;
            audioPlayer.currentTime = Math.min(next.end, dur);
        }
        refreshBlankNav();
    }

    function jumpToPrevBlank() {
        if (!blankIntervals.length || !audioPlayer.src) return;
        const cur = audioPlayer.currentTime;
        // 現在位置より前にある、直近で通過した無音区間の「終わり」へ戻る
        let prev = null;
        for (const iv of blankIntervals) {
            if (iv.end < cur - 0.5) prev = iv;
            else break;
        }
        audioPlayer.currentTime = prev ? prev.end : 0;
        refreshBlankNav();
    }

    blankNextBtn.addEventListener('click', () => {
        if (blankNextBtn.classList.contains('disabled')) return;
        jumpToNextBlank();
        userSeekedSinceLoad = true;
    });

    blankPrevBtn.addEventListener('click', () => {
        if (blankPrevBtn.classList.contains('disabled')) return;
        jumpToPrevBlank();
        userSeekedSinceLoad = true;
    });

    // ----------------------------------------------------
    // ブランクスキップ用JSONの読込み（_JSONフォルダから自動で見つけて適用する）
    // ----------------------------------------------------

    // ファイル名比較用の正規化
    // ・全角/半角の表記ゆれをNFKCで吸収
    // ・「〜」（波ダッシュ）はMac(U+301C)とWindows(U+FF5E)で異なる文字が使われがちなため、
    //   見た目が同じ記号（〜・～・~・⁓）を同一視する
    function normalizeFileNameForCompare(name) {
        if (!name) return '';
        return name
            .normalize('NFKC')
            .replace(/[\u301C\uFF5E\u2053\u007E]/g, '~');
    }

    // 日本標準時（UTC+9固定）でISO 8601形式の文字列を生成する（例: 2026-08-22T03:23:25.957+09:00）。
    // オフセット付きISO文字列なので、new Date(str).getTime() による新旧比較には引き続き問題なく使える。
    function toJSTISOString(date) {
        const jstOffsetMs = 9 * 60 * 60 * 1000;
        const jst = new Date(date.getTime() + jstOffsetMs);
        const pad = (n, l = 2) => String(n).padStart(l, '0');
        return `${jst.getUTCFullYear()}-${pad(jst.getUTCMonth() + 1)}-${pad(jst.getUTCDate())}T` +
               `${pad(jst.getUTCHours())}:${pad(jst.getUTCMinutes())}:${pad(jst.getUTCSeconds())}.` +
               `${pad(jst.getUTCMilliseconds(), 3)}+09:00`;
    }

    // このブラウザ（端末）を識別する簡単なラベル（OS種別＋ランダム4桁、個人情報は含まない）
    function getDeviceLabel() {
        let label = localStorage.getItem('deviceLabel');
        if (!label) {
            const ua = navigator.userAgent;
            const isAndroid = /Android/i.test(ua);
            const isMac = !isAndroid && /Macintosh|Mac OS X/i.test(ua);
            const isWindows = !isAndroid && /Windows/i.test(ua);
            const osLabel = isAndroid ? 'Android' : isMac ? 'Mac' : isWindows ? 'Windows' : 'Device';
            const randomSuffix = Math.random().toString(16).slice(2, 6).toUpperCase();
            label = `${osLabel}-${randomSuffix}`;
            localStorage.setItem('deviceLabel', label);
        }
        return label;
    }

    // .blanks.json の内容（app/version/fileName/duration/generatedAt/intervals/position/updated/device）を
    // 読み込んで、ブランクスキップと再生位置の両方に反映する。
    function applyLoadedBlanksData(data, myFileName) {
        if (!data || typeof data !== 'object') {
            updateBlankUI('notfound');
            updatePositionStatus('error');
            return;
        }

        blanksFileData = data;
        blankIntervals = Array.isArray(data.intervals) ? data.intervals.filter(
            iv => iv && typeof iv.start === 'number' && typeof iv.end === 'number' && iv.end > iv.start
        ) : [];
        blankLocalDone = true;
        updateBlankUI('done');

        // 再生位置の反映（updatedのタイムスタンプで新旧比較。「後勝ち」方式）
        if (typeof data.position === 'number' && data.updated) {
            const rawLocal = localStorage.getItem(`resume_${myFileName}`);
            let localRecord = null;
            try { localRecord = rawLocal ? JSON.parse(rawLocal) : null; } catch (e) { localRecord = null; }

            const cloudUpdatedMs = new Date(data.updated).getTime();
            const localUpdatedMs = localRecord ? localRecord.updatedAt : 0;

            if (!localRecord || cloudUpdatedMs > localUpdatedMs) {
                localStorage.setItem(`resume_${myFileName}`, JSON.stringify({ position: data.position, updatedAt: cloudUpdatedMs }));

                // ユーザー自身がまだ手動でシークしていなければ、他デバイスでの続きの位置に合わせる
                if (!userSeekedSinceLoad && data.position > 0) {
                    audioPlayer.currentTime = data.position;
                    resumeStatus.textContent = '前回位置から再開（_JSON同期）';
                    setTimeout(() => { resumeStatus.textContent = ""; }, 3000);
                }
                console.log(`[_JSON] position読み込み・適用: ${data.position.toFixed(1)}秒 (更新: ${data.updated} / ${data.device || '不明'})`);
            } else {
                console.log(`[_JSON] ローカルの方が新しいため再生位置は適用せず`);
            }

            updatePositionStatus('loaded');
            const myToken = blankScanToken;
            setTimeout(() => {
                if (myToken === blankScanToken) updatePositionStatus('recording');
            }, 2500);
        } else {
            // position情報を含まない旧形式ファイル。今後の一時停止/自動保存から記録を開始する
            updatePositionStatus('recording');
        }
    }

    // ----------------------------------------------------
    // _JSONフォルダからの自動読み込み（File System Access API）
    // 対応ブラウザ（Chrome系）でのみ動作。非対応の場合は従来の手動選択にフォールバックする。
    // ----------------------------------------------------
    const FS_ACCESS_SUPPORTED = typeof window.showDirectoryPicker === 'function';
    let cachedAudioDirHandle = null;

    function idbOpen() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open('radiko-pwa-fs', 1);
            req.onupgradeneeded = () => {
                if (!req.result.objectStoreNames.contains('handles')) {
                    req.result.createObjectStore('handles');
                }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function idbGet(key) {
        try {
            const db = await idbOpen();
            return await new Promise((resolve, reject) => {
                const tx = db.transaction('handles', 'readonly');
                const req = tx.objectStore('handles').get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            return null;
        }
    }

    async function idbSet(key, value) {
        try {
            const db = await idbOpen();
            await new Promise((resolve, reject) => {
                const tx = db.transaction('handles', 'readwrite');
                tx.objectStore('handles').put(value, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        } catch (e) {
            // 保存に失敗しても致命的ではないため無視（次回また選択を求めるだけ）
        }
    }

    async function verifyDirPermission(handle, allowPrompt) {
        // readwrite で統一する。.blanks.json への position 書き込み・新規作成に必要なため
        // （readwriteの許可は読み取りも内包する）。
        const opts = { mode: 'readwrite' };
        try {
            if (allowPrompt) {
                return (await handle.requestPermission(opts)) === 'granted';
            }
            return (await handle.queryPermission(opts)) === 'granted';
        } catch (e) {
            return false;
        }
    }

    // 保存済みのフォルダハンドルをページ読み込み時（＝ユーザー操作を待たず）に先読みしておく。
    let audioDirHandlePrefetch = null;
    if (FS_ACCESS_SUPPORTED) {
        audioDirHandlePrefetch = idbGet('audioDirHandle').then((stored) => {
            if (stored) cachedAudioDirHandle = stored;
        }).catch(() => {});
    }

    // 自動チェック用：既に許可済み（'granted'）のフォルダがあれば返す。
    // queryPermissionのみを使い、requestPermission/showDirectoryPickerは一切呼ばない
    // （ユーザー操作なしで呼ぶと、Androidだけでなく実際にはMacでも
    //  「Must be handling a user gesture」エラーになることが確認されたため）。
    async function getAudioDirHandleSilently() {
        if (audioDirHandlePrefetch) {
            await audioDirHandlePrefetch;
            audioDirHandlePrefetch = null;
        }
        if (cachedAudioDirHandle && (await verifyDirPermission(cachedAudioDirHandle, false))) {
            console.log(`[_JSON自動探索] 許可済みフォルダを使用: "${cachedAudioDirHandle.name}"`);
            return cachedAudioDirHandle;
        }
        return null;
    }

    // タップ（明示的なクリック）から呼ぶ用：showDirectoryPicker/requestPermissionを
    // 一切のawaitを挟まず、ハンドラの最初の非同期処理として直接呼ぶ。
    // これにより「ユーザー操作起因」であることをブラウザに正しく認識させる。
    async function requestAudioDirHandleFromGesture() {
        if (cachedAudioDirHandle) {
            try {
                if ((await cachedAudioDirHandle.requestPermission({ mode: 'readwrite' })) === 'granted') {
                    console.log(`[_JSON自動探索] 許可を再確認: "${cachedAudioDirHandle.name}"`);
                    return cachedAudioDirHandle;
                }
            } catch (e) {
                // フォールバックして下の新規選択に進む
            }
        }
        try {
            const handle = await window.showDirectoryPicker({ id: 'radiko-audio-dir', mode: 'readwrite' });
            console.log(`[_JSON自動探索] 新しくフォルダを選択: "${handle.name}"`);
            cachedAudioDirHandle = handle;
            idbSet('audioDirHandle', handle);
            return handle;
        } catch (e) {
            console.log('[_JSON自動探索] フォルダ選択がキャンセルされました、または権限が得られませんでした', e);
            return null;
        }
    }

    // 保存されているフォルダへのアクセス許可をリセットする。
    // 誤って別のフォルダ（音声ファイルの祖先/子孫フォルダなど）を選んでしまった場合、
    // 次回のフォルダ選択ダイアログを再度出すために使う。
    async function resetAudioDirHandle() {
        cachedAudioDirHandle = null;
        audioDirHandlePrefetch = null;
        try {
            const db = await idbOpen();
            await new Promise((resolve, reject) => {
                const tx = db.transaction('handles', 'readwrite');
                tx.objectStore('handles').delete('audioDirHandle');
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        } catch (e) {
            // no-op
        }
        console.log('[_JSON自動探索] フォルダのアクセス許可をリセットしました。次回タップした時に再度選択できます。');
    }

    // タップ／長押しの共通セットアップ：
    // ・短いタップ: その場でフォルダへのアクセスを要求し（未許可なら）、見つかれば/作成できれば適用する
    // ・長押し: 保存済みのフォルダ許可をリセットする（誤ったフォルダを選んでしまった場合の救済）
    // ブランク表示・再生位置表示のどちらをタップしても、同じ_JSONフォルダに対する処理なので同じ動作にする。
    function setupStatusTapAndHold(hitElement, onResetMessage) {
        let pressTimer = null;
        let longPressFired = false;
        const LONG_PRESS_MS = 800;

        function start() {
            longPressFired = false;
            pressTimer = setTimeout(async () => {
                pressTimer = null;
                longPressFired = true;
                const ok = confirm('保存されている_JSONフォルダへのアクセス許可をリセットしますか？\n次回タップした時に、フォルダの選択ダイアログが再度表示されます。');
                if (ok) {
                    await resetAudioDirHandle();
                    updateBlankUI('idle');
                    updatePositionStatus('checking');
                    onResetMessage();
                }
            }, LONG_PRESS_MS);
        }
        function cancelTimer() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        hitElement.addEventListener('mousedown', start);
        hitElement.addEventListener('mouseup', cancelTimer);
        hitElement.addEventListener('mouseleave', cancelTimer);
        hitElement.addEventListener('touchstart', start, { passive: true });
        hitElement.addEventListener('touchend', cancelTimer);
        hitElement.addEventListener('touchmove', cancelTimer);

        hitElement.addEventListener('click', async () => {
            if (longPressFired) { longPressFired = false; return; } // 長押し操作直後のclickは無視
            if (!currentFileName) return;
            if (!FS_ACCESS_SUPPORTED) return;
            // 既に正常に動作中（ブランク検出済み かつ 記録中）なら、タップは無視してよい
            if (blankUIState === 'done' && positionUIState === 'recording') return;

            // ここが起点：一切のawaitを挟まずshowDirectoryPicker/requestPermissionを直接呼ぶ
            const myToken = blankScanToken;
            await loadOrCreateBlanksFile(currentFileName, myToken, true);
        });
    }

    setupStatusTapAndHold(blankStatusHit, () => {
        blankStatus.textContent = 'フォルダ許可をリセットしました（タップで再選択）';
    });
    setupStatusTapAndHold(positionStatusHit, () => {
        positionStatus.textContent = 'フォルダ許可をリセットしました（タップで再選択）';
    });

    // 指定フォルダの「_JSON」内から <ファイル名>.blanks.json を探して読み込む。
    // 見つからず、かつ書き込み権限があれば、無音検出結果なしの新規ファイルを作成する。
    // forceGesture=true のときだけ、フォルダ未許可ならその場でダイアログを出す（タップ起点でのみ使用）。
    async function loadOrCreateBlanksFile(myFileName, myToken, forceGesture) {
        if (!FS_ACCESS_SUPPORTED) {
            updateBlankUI('unsupported');
            updatePositionStatus('unsupported');
            return;
        }

        const dirHandle = forceGesture
            ? await requestAudioDirHandleFromGesture()
            : await getAudioDirHandleSilently();

        if (myToken !== blankScanToken || currentFileName !== myFileName) return;

        if (!dirHandle) {
            updateBlankUI('notfound');
            updatePositionStatus('nofolder');
            return;
        }

        let jsonDirHandle;
        try {
            jsonDirHandle = await dirHandle.getDirectoryHandle('_JSON', { create: true });
        } catch (e) {
            console.log(`[_JSON] "${dirHandle.name}" 内に "_JSON" フォルダを作成/取得できません`, e);
            updateBlankUI('notfound');
            updatePositionStatus('error');
            return;
        }

        const audioBase = myFileName.replace(/\.[^/.]+$/, '');
        const targetName = normalizeFileNameForCompare(`${audioBase}.blanks.json`);

        let matchedHandle = null;
        try {
            for await (const [name, handle] of jsonDirHandle.entries()) {
                if (handle.kind !== 'file') continue;
                if (normalizeFileNameForCompare(name) === targetName) {
                    matchedHandle = handle;
                    break;
                }
            }
        } catch (e) {
            console.log('[_JSON] フォルダの読み取りに失敗', e);
            updateBlankUI('notfound');
            updatePositionStatus('error');
            return;
        }

        if (myToken !== blankScanToken || currentFileName !== myFileName) return;

        if (matchedHandle) {
            let data;
            try {
                const file = await matchedHandle.getFile();
                data = JSON.parse(await file.text());
            } catch (e) {
                console.log('[_JSON] blanks.jsonの読み込み/解析に失敗', e);
                updateBlankUI('notfound');
                updatePositionStatus('error');
                return;
            }
            if (myToken !== blankScanToken || currentFileName !== myFileName) return;
            console.log(`[_JSON] blanks.jsonを発見・読込み: "${matchedHandle.name}"`);
            applyLoadedBlanksData(data, myFileName);
            return;
        }

        // 見つからない場合：書き込み権限があれば、検出結果なしの新規ファイルを作成する
        console.log(`[_JSON] 一致するblanks.jsonなし。新規作成を試みます（対象: ${audioBase}.blanks.json）`);
        const hasWrite = await verifyDirPermission(dirHandle, false);
        if (myToken !== blankScanToken || currentFileName !== myFileName) return;

        if (!hasWrite) {
            updateBlankUI('notfound');
            updatePositionStatus('nofolder');
            return;
        }

        const newData = {
            app: 'RadikoPWA-BlankDetector',
            version: 2,
            fileName: myFileName,
            duration: isFinite(audioPlayer.duration) ? audioPlayer.duration : null,
            generatedAt: new Date().toISOString(),
            intervals: []
            // position/updated/deviceはここでは書かない。実際に一時停止/自動保存が
            // 起きるまでは「position情報なし」として扱い、他デバイスの正当な再生位置を
            // 「作りたてのposition:0」で誤って上書きしてしまわないようにするため。
        };

        try {
            const fileHandle = await jsonDirHandle.getFileHandle(`${audioBase}.blanks.json`, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(JSON.stringify(newData, null, 2));
            await writable.close();
            console.log(`[_JSON] blanks.jsonを新規作成: ${audioBase}.blanks.json`);
        } catch (e) {
            console.log('[_JSON] blanks.json新規作成に失敗', e);
            updateBlankUI('notfound');
            updatePositionStatus('error');
            return;
        }

        if (myToken !== blankScanToken || currentFileName !== myFileName) return;

        blanksFileData = newData;
        blankIntervals = [];
        blankLocalDone = true;
        updateBlankUI('notfound'); // 検出結果自体はまだ無い
        updatePositionStatus('recording');
    }

    // _JSON/<ファイル名>.blanks.json の position/updated/device を更新して書き戻す。
    // 既存のintervals等は保持する。一時停止時、および再生中10秒おきに呼ばれる。
    // 書き込み権限が無ければプロンプトは出さず静かに諦める（スリープタイマー由来の一時停止など
    // ユーザー操作を伴わないタイミングで発火することもあるため）。
    async function writePositionUpdate(position) {
        if (!FS_ACCESS_SUPPORTED || !currentFileName) return;
        if (!cachedAudioDirHandle) return;

        try {
            const hasWrite = await verifyDirPermission(cachedAudioDirHandle, false);
            if (!hasWrite) return;

            const jsonDirHandle = await cachedAudioDirHandle.getDirectoryHandle('_JSON', { create: true });
            const audioBase = currentFileName.replace(/\.[^/.]+$/, '');
            const fileHandle = await jsonDirHandle.getFileHandle(`${audioBase}.blanks.json`, { create: true });

            const base = blanksFileData || {
                app: 'RadikoPWA-BlankDetector',
                version: 2,
                fileName: currentFileName,
                duration: isFinite(audioPlayer.duration) ? audioPlayer.duration : null,
                generatedAt: new Date().toISOString(),
                intervals: blankIntervals || []
            };

            const payload = {
                ...base,
                fileName: currentFileName,
                intervals: blankIntervals || base.intervals || [],
                position: position,
                updated: toJSTISOString(new Date()),
                device: getDeviceLabel()
            };

            const writable = await fileHandle.createWritable();
            await writable.write(JSON.stringify(payload, null, 2));
            await writable.close();

            blanksFileData = payload;
            updatePositionStatus('recording');
            console.log(`[_JSON] position更新: ${position.toFixed(1)}秒`);
        } catch (e) {
            console.log('[_JSON] position書き込みエラー', e);
            updatePositionStatus('error');
        }
    }

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        currentFileName = file.name;
        currentHpUrl = "";
        hpBtn.classList.add('disabled');
        resumeStatus.textContent = ""; 
        lyricsOverlay.classList.remove('active'); 
        userSeekedSinceLoad = false;
        lastDiskSavedTime = 0;
        blanksFileData = null;

        // このファイル読み込みセッションの識別子（別ファイルへの切り替え時に古い非同期処理を無視するため）
        const fileToken = ++blankScanToken;

        blankIntervals = [];
        updateBlankUI('idle');           // "確認中…"
        updatePositionStatus('checking'); // "確認中…"

        // _JSONフォルダの自動探索は、ファイル選択という「ユーザー操作」の直後、できるだけ早いタイミングで
        // 開始する。ただしここは silent（フォルダ未許可ならダイアログを出さない）。
        // ファイル選択のchangeイベントから直接showDirectoryPickerを呼ぶと、Android/macOSともに
        // 「ユーザー操作起因ではない」と判定されてしまうことが確認されているため。
        // 未許可の場合は「タップで許可」の表示になり、ブランク/再生位置どちらかのテキストをタップすれば許可できる。
        loadOrCreateBlanksFile(file.name, fileToken, false);

        jsmediatags.read(file, {
            onSuccess: function(tag) {
                const tags = tag.tags;
                trackTitle.textContent = tags.title || file.name;
                trackAlbum.textContent = tags.album || "-";
                trackArtist.textContent = tags.artist || "-";

                let loadedLyrics = tags.lyrics || (tags.unsynchronisedLyrics ? tags.unsynchronisedLyrics.text : "");
                lyricsContent.textContent = loadedLyrics ? loadedLyrics : "歌詞情報が含まれていないか、読み込めませんでした。";

                // ----------------------------------------------------
                // 修正版: Commentタグを最優先とするURL抽出ロジック
                // ----------------------------------------------------
                let foundUrl = null;

                // 1. 最優先: Commentタグを掘る
                if (tags.comment) {
                    if (typeof tags.comment === 'string') {
                        foundUrl = tags.comment;
                    } else if (typeof tags.comment === 'object' && tags.comment.text) {
                        foundUrl = tags.comment.text;
                    }
                }

                // 2. なければフォールバック1: TXXXタグ (HP)
                if (!foundUrl && tags.TXXX) {
                    const txxxArray = Array.isArray(tags.TXXX) ? tags.TXXX : [tags.TXXX];
                    for (let t of txxxArray) {
                        if (t.data && t.data.description && t.data.description.toUpperCase() === 'HP') {
                            foundUrl = t.data.text;
                            break;
                        }
                    }
                }

                // 3. なければフォールバック2: メタデータ全体の文字列からURLを自動走査
                if (!foundUrl) {
                    try {
                        const tagsString = JSON.stringify(tags);
                        const urlMatch = tagsString.match(/https?:\/\/[a-zA-Z0-9.\-_~:/?#[\]@!$&'()*+,;=%]+/);
                        if (urlMatch) {
                            foundUrl = urlMatch[0];
                        }
                    } catch(e) {}
                }

                // トリミングして有効なURLか検証
                if (foundUrl) {
                    foundUrl = foundUrl.trim();
                    if (foundUrl.startsWith('http')) {
                        currentHpUrl = foundUrl;
                        hpBtn.classList.remove('disabled');
                    }
                }
                // ----------------------------------------------------

                if (tags.picture) {
                    const { data, format } = tags.picture;
                    let base64String = "";
                    for (let i = 0; i < data.length; i++) {
                        base64String += String.fromCharCode(data[i]);
                    }
                    coverArt.style.backgroundImage = `url(data:${format};base64,${btoa(base64String)})`;
                    coverArt.textContent = "";
                } else {
                    coverArt.style.backgroundImage = "none";
                    coverArt.textContent = "[No Cover] (クリックで歌詞)";
                }
            },
            onError: function() {
                trackTitle.textContent = file.name;
                coverArt.style.backgroundImage = "none";
                coverArt.textContent = "[No Cover]";
                lyricsContent.textContent = "タグの読み込みエラー。";
            }
        });

        audioPlayer.src = URL.createObjectURL(file);
    });

    audioPlayer.addEventListener('loadedmetadata', () => {
        const duration = audioPlayer.duration;

        seekBar.min = 0;
        seekBar.max = isFinite(duration) ? duration : 0;
        seekBar.value = 0;
        seekBar.style.setProperty('--val', '0%');

        updateTimeDisplay(0, duration);

        const rawSaved = localStorage.getItem(`resume_${currentFileName}`);
        if (rawSaved) {
            let record;
            try {
                record = JSON.parse(rawSaved);
            } catch (e) {
                record = { position: parseFloat(rawSaved), updatedAt: 0 }; // 旧形式（数値のみ）との互換
            }
            if (record && record.position > 0) {
                audioPlayer.currentTime = record.position;
                resumeStatus.textContent = `前回位置から再開`;
                setTimeout(() => { resumeStatus.textContent = ""; }, 3000);
            }
        }

        lastSavedTime = audioPlayer.currentTime;
        audioPlayer.play().catch(e => console.log("自動再生ブロック"));
    });

    audioPlayer.addEventListener('timeupdate', () => {
        if (isDragging) return;

        const current = audioPlayer.currentTime;
        updateTimeDisplay(current, audioPlayer.duration);
        updateSeekBarVisual(current, audioPlayer.duration);
        seekBar.value = current;
        refreshBlankNav();

        // レジューム位置の保存は厳密な精度が不要なため、数秒おきに間引いて記録する（ローカル）
        if (currentFileName && current > 0 && Math.abs(current - lastSavedTime) >= RESUME_SAVE_INTERVAL) {
            saveResumePosition(current);
        }

        // _JSON/*.blanks.json への書き込みは10秒おきに間引く（Dropbox等への同期負荷を抑えるため）
        if (currentFileName && current > 0 && Math.abs(current - lastDiskSavedTime) >= DISK_SAVE_INTERVAL) {
            lastDiskSavedTime = current;
            writePositionUpdate(current);
        }
    });

    // ----------------------------------------------------
    // らじるらじる等のVBRファイル迷子対策 (ストalled / waiting 監視)
    // ----------------------------------------------------
    audioPlayer.addEventListener('waiting', () => {
        // シーク後などにデータが詰まったら、一瞬だけ再生位置をわずかに進めて強制リフレッシュをかける
        if (!audioPlayer.paused && !isDragging) {
            setTimeout(() => {
                if (audioPlayer.readyState < 3) { // 充分なデータが溜まっていない場合
                    audioPlayer.currentTime = audioPlayer.currentTime + 0.1;
                }
            }, 500);
        }
    });
    // ----------------------------------------------------

    playBtn.addEventListener('click', () => {
        if (!audioPlayer.src) return;
        if (audioPlayer.paused) audioPlayer.play();
        else audioPlayer.pause();
    });

    audioPlayer.addEventListener('play', () => {
        playBtn.innerHTML = svgPause;
        playBtn.classList.add('playing');
    });

    audioPlayer.addEventListener('pause', () => {
        playBtn.innerHTML = svgPlay;
        playBtn.classList.remove('playing');
        saveResumePosition(audioPlayer.currentTime);
        writePositionUpdate(audioPlayer.currentTime);
    });

    audioPlayer.addEventListener('ended', () => {
        playBtn.innerHTML = svgPlay;
        playBtn.classList.remove('playing');
        if (currentFileName) {
            localStorage.removeItem(`resume_${currentFileName}`);
        }
    });

    // Androidでは "intent://" スキームを使うことで、PWA内(Chrome)ではなく
    // 端末のデフォルトブラウザ（Firefox/Safari等に設定していればそちら）で開かせる。
    // Mac/PC等ではAndroidのIntentの仕組みが無いため、従来通りwindow.openで開く。
    function openHomepage(url) {
        if (!url) return;
        const isAndroid = /Android/i.test(navigator.userAgent);

        if (isAndroid) {
            try {
                const u = new URL(url);
                const scheme = u.protocol.replace(':', ''); // "http" または "https"
                const withoutScheme = url.slice(u.protocol.length + 2); // 先頭の "scheme://" を除いた部分
                const intentUrl = `intent://${withoutScheme}#Intent;scheme=${scheme};action=android.intent.action.VIEW;end`;
                window.location.href = intentUrl;
                return;
            } catch (e) {
                // URL解析に失敗した場合は通常通り開く
            }
        }

        window.open(url, '_blank', 'noopener');
    }

    hpBtn.addEventListener('click', () => {
        if (currentHpUrl && !hpBtn.classList.contains('disabled')) {
            openHomepage(currentHpUrl);
        }
    });

    // ----------------------------------------------------
    // トーク強調（声の帯域を軽くブーストして聴き取りやすくする）
    // BiquadFilterNodeはネイティブ実装で非常に軽量なため、常時接続しておき、
    // オン/オフはパラメータ（gain/frequency）の切り替えだけで行う。
    // ・低域ハイパス: 環境ノイズを緩やかにカット
    // ・ピーキングEQ : 2kHz付近（声の明瞭度に効く帯域）をブースト
    // ----------------------------------------------------
    let talkAudioCtx = null;
    let talkMediaSource = null;
    let talkLowCutFilter = null;
    let talkSpeechFilter = null;
    let talkEnhanceLevel = 'off'; // 'off' | 'low' | 'high'

    const TALK_PEAK_FREQ = 2000;    // 中心周波数 2kHz（声の明瞭度に効く帯域、レベル共通）
    const TALK_PEAK_Q = 1.0;

    // レベルごとの設定。段階が上がるほど低音カットを強め、ブースト量を増やす。
    const TALK_LEVELS = {
        off:  { highpass: 20,  peakGain: 0.0 },  // 事実上無効化
        low:  { highpass: 150, peakGain: 5.0 },  // これまでのオン相当
        high: { highpass: 220, peakGain: 9.0 }   // さらに声を強調
    };
    const TALK_LEVEL_ORDER = ['off', 'low', 'high'];
    const TALK_LEVEL_LABEL = { off: 'OFF', low: 'Low', high: 'High' };

    function ensureTalkAudioGraph() {
        if (talkAudioCtx) return true;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return false;

            talkAudioCtx = new AC();
            talkMediaSource = talkAudioCtx.createMediaElementSource(audioPlayer);

            talkLowCutFilter = talkAudioCtx.createBiquadFilter();
            talkLowCutFilter.type = 'highpass';
            talkLowCutFilter.frequency.value = TALK_LEVELS.off.highpass;

            talkSpeechFilter = talkAudioCtx.createBiquadFilter();
            talkSpeechFilter.type = 'peaking';
            talkSpeechFilter.frequency.value = TALK_PEAK_FREQ;
            talkSpeechFilter.Q.value = TALK_PEAK_Q;
            talkSpeechFilter.gain.value = TALK_LEVELS.off.peakGain;

            talkMediaSource.connect(talkLowCutFilter);
            talkLowCutFilter.connect(talkSpeechFilter);
            talkSpeechFilter.connect(talkAudioCtx.destination);
            return true;
        } catch (e) {
            console.log('トーク強調機能を初期化できませんでした', e);
            talkAudioCtx = null;
            return false;
        }
    }

    function setTalkEnhanceLevel(level) {
        if (!ensureTalkAudioGraph()) return; // 非対応環境では何もしない

        if (talkAudioCtx.state === 'suspended') {
            talkAudioCtx.resume().catch(() => {});
        }

        talkEnhanceLevel = level;
        const cfg = TALK_LEVELS[level];
        const now = talkAudioCtx.currentTime;
        talkLowCutFilter.frequency.setTargetAtTime(cfg.highpass, now, 0.05);
        talkSpeechFilter.gain.setTargetAtTime(cfg.peakGain, now, 0.05);

        talkEnhanceBtn.classList.remove('level-low', 'level-high');
        if (level === 'low') talkEnhanceBtn.classList.add('level-low');
        if (level === 'high') talkEnhanceBtn.classList.add('level-high');

        talkEnhanceStatus.textContent = TALK_LEVEL_LABEL[level];
        talkEnhanceStatus.classList.remove('level-low', 'level-high');
        if (level === 'low') talkEnhanceStatus.classList.add('level-low');
        if (level === 'high') talkEnhanceStatus.classList.add('level-high');
    }

    talkEnhanceBtn.addEventListener('click', () => {
        const idx = TALK_LEVEL_ORDER.indexOf(talkEnhanceLevel);
        const next = TALK_LEVEL_ORDER[(idx + 1) % TALK_LEVEL_ORDER.length];
        setTalkEnhanceLevel(next);
    });

    // ----------------------------------------------------
    // 早送り・巻き戻し（10秒／30秒）
    // ----------------------------------------------------
    rewindBtn.addEventListener('click', () => {
        if (!audioPlayer.src) return;
        audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 10);
        userSeekedSinceLoad = true;
    });

    forwardBtn.addEventListener('click', () => {
        if (!audioPlayer.src) return;
        const dur = isFinite(audioPlayer.duration) ? audioPlayer.duration : audioPlayer.currentTime + 10;
        audioPlayer.currentTime = Math.min(dur, audioPlayer.currentTime + 10);
        userSeekedSinceLoad = true;
    });

    rewind30Btn.addEventListener('click', () => {
        if (!audioPlayer.src) return;
        audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 30);
        userSeekedSinceLoad = true;
    });

    forward30Btn.addEventListener('click', () => {
        if (!audioPlayer.src) return;
        const dur = isFinite(audioPlayer.duration) ? audioPlayer.duration : audioPlayer.currentTime + 30;
        audioPlayer.currentTime = Math.min(dur, audioPlayer.currentTime + 30);
        userSeekedSinceLoad = true;
    });

    // ----------------------------------------------------
    // スリープタイマー（クリックでOFF→15→30→45→60→90分を循環）
    // ----------------------------------------------------
    const SLEEP_PRESETS = [0, 15, 30, 45, 60, 90]; // 分。0はOFF
    let sleepIndex = 0;
    let sleepTimeoutId = null;
    let sleepIntervalId = null;
    let sleepEndTime = null;

    function clearSleepTimer() {
        if (sleepTimeoutId) clearTimeout(sleepTimeoutId);
        if (sleepIntervalId) clearInterval(sleepIntervalId);
        sleepTimeoutId = null;
        sleepIntervalId = null;
        sleepEndTime = null;
        sleepBtn.classList.remove('active');
        sleepStatus.classList.remove('active');
    }

    function updateSleepDisplay() {
        if (!sleepEndTime) return;
        const remainMs = sleepEndTime - Date.now();
        if (remainMs <= 0) {
            sleepStatus.textContent = 'OFF';
            return;
        }
        const totalSec = Math.ceil(remainMs / 1000);
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        sleepStatus.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }

    function startSleepTimer(minutes) {
        clearSleepTimer();
        if (minutes <= 0) {
            sleepStatus.textContent = 'OFF';
            return;
        }
        sleepEndTime = Date.now() + minutes * 60 * 1000;
        sleepBtn.classList.add('active');
        sleepStatus.classList.add('active');
        updateSleepDisplay();
        sleepIntervalId = setInterval(updateSleepDisplay, 1000);
        sleepTimeoutId = setTimeout(() => {
            audioPlayer.pause();
            sleepIndex = 0;
            clearSleepTimer();
            sleepStatus.textContent = 'OFF';
        }, minutes * 60 * 1000);
    }

    sleepBtn.addEventListener('click', () => {
        sleepIndex = (sleepIndex + 1) % SLEEP_PRESETS.length;
        startSleepTimer(SLEEP_PRESETS[sleepIndex]);
    });

    coverArt.addEventListener('click', () => {
        if (currentFileName) lyricsOverlay.classList.toggle('active');
    });
    lyricsClose.addEventListener('click', () => lyricsOverlay.classList.remove('active'));

</script>
</body>
